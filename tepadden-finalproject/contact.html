<main class="container">
    <section>
        <h2>Request a Project</h2>
        <p>
            Use this form to reach out about video services. The form collects basic project
            information so I can understand the type of work needed.
        </p>

        <form action="#">
            <label for="name">Name:</label>
            <input type="text" id="name" name="clientName">

            <label for="email">Email:</label>
            <input type="email" id="email" name="clientEmail">

            <label for="project">Project Type:</label>
            <input type="text" id="project" name="projectType">

            <label for="budget">Estimated Budget:</label>
            <input type="text" id="budget" name="estimatedBudget">

            <label for="message">Message:</label>
            <textarea id="message" name="projectMessage"></textarea>

            <input type="submit" value="Submit Request">
        </form>

        <p>Email me directly: <a href="mailto:tepadden@asu.edu">tepadden@asu.edu</a></p>
    </section>
